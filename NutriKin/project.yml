name: NutriKin
options:
  bundleIdPrefix: com.sundarBandiguptapu
  deploymentTarget:
    iOS: "17.0"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
targets:
  NutriKin:
    type: application
    platform: iOS
    sources:
      - path: ../FamilyFoodScanner/App
        group: App
      - path: ../FamilyFoodScanner/Models
        group: Models
      - path: ../FamilyFoodScanner/Services
        group: Services
      - path: ../FamilyFoodScanner/Views
        group: Views
      - path: ../FamilyFoodScanner/Assets.xcassets
        group: Resources
    dependencies:
      - package: Supabase
        product: Supabase
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: NutriKin
        # The app only uses standard HTTPS, so it's exempt from export-compliance
        # questions (this stops App Store Connect asking on every build).
        ITSAppUsesNonExemptEncryption: false
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLName: com.sundarBandiguptapu.NutriKin
            CFBundleURLSchemes: [nutrikin]
        NSCameraUsageDescription: Scan product barcodes, photograph labels, and photograph your meals to check them for your family.
        NSHealthShareUsageDescription: Read your weight, blood sugar, blood pressure, steps, calories burned and workouts to personalise food and activity tracking.
        NSHealthUpdateUsageDescription: NutriKin only reads your health data. It never writes to Apple Health.
    entitlements:
      path: Generated/NutriKin.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.applesignin: [Default]
        # No "com.apple.developer.healthkit.access" key here on purpose:
        # that entitlement is specifically for Clinical Health Records
        # (FHIR documents), which personal/free Apple ID teams can't
        # provision. This app only reads ordinary quantity samples
        # (weight, blood glucose, etc.) via HKHealthStore.requestAuthorization,
        # which the plain HealthKit capability above already covers.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sundarBandiguptapu.NutriKin
        # Your Apple Developer team (individual membership). Automatic signing
        # registers capabilities such as HealthKit for the App ID.
        DEVELOPMENT_TEAM: 2RV7CUN4X6
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # iPhone only for now (avoids iPad screenshots and layout requirements).
        TARGETED_DEVICE_FAMILY: "1"
        # Bump CURRENT_PROJECT_VERSION for every build you upload to TestFlight.
        MARKETING_VERSION: "1.2.0"
        CURRENT_PROJECT_VERSION: "16"
  NutriKinTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ../FamilyFoodScanner/Tests
        group: Tests
    dependencies:
      - target: NutriKin
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  NutriKin:
    build:
      targets:
        NutriKin: all
    test:
      targets: [NutriKinTests]
